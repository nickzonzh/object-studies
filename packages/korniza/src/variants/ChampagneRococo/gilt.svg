<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" preserveAspectRatio="none">
  <!-- One continuous nonrepeating field across the whole gilded face. Water
       gilding is finished in lengths: a gilder burnishes some passages with an
       agate and leaves the next matte, so a rail is never one even tone. The
       long low ellipses are those lengths running with the rails, the round
       ones are pools of warmth where the size has darkened, and the short
       strokes are bole wear on crests, which on a champagne frame rubs back to
       white gesso rather than to red clay. Soft asymmetric changes in tone
       only: no grain, hard tile boundaries or filters. -->
  <defs>
    <linearGradient id="leaf"><stop stop-color="#fff2d6" stop-opacity=".05"/><stop offset=".46" stop-color="#d6b891" stop-opacity="0"/><stop offset="1" stop-color="#8d6a4c" stop-opacity=".045"/></linearGradient>
    <radialGradient id="warm"><stop stop-color="#7e5c42" stop-opacity=".17"/><stop offset=".45" stop-color="#7e5c42" stop-opacity=".08"/><stop offset="1" stop-color="#7e5c42" stop-opacity="0"/></radialGradient>
    <radialGradient id="burnish"><stop stop-color="#fdf6e2" stop-opacity=".2"/><stop offset="1" stop-color="#fdf6e2" stop-opacity="0"/></radialGradient>
  </defs>
  <path fill="url(#leaf)" d="M0 0H137V600H0ZM139 0H293V600H139ZM295 0H459V600H295ZM461 0H600V600H461Z"/>
  <ellipse fill="url(#burnish)" cx="148" cy="17" rx="118" ry="14"/>
  <ellipse fill="url(#warm)" cx="386" cy="22" rx="96" ry="12"/>
  <ellipse fill="url(#burnish)" cx="552" cy="15" rx="62" ry="11"/>
  <ellipse fill="url(#warm)" cx="22" cy="214" rx="13" ry="104"/>
  <ellipse fill="url(#burnish)" cx="17" cy="428" rx="12" ry="82"/>
  <ellipse fill="url(#burnish)" cx="581" cy="188" rx="12" ry="96"/>
  <ellipse fill="url(#warm)" cx="586" cy="402" rx="11" ry="74"/>
  <ellipse fill="url(#warm)" cx="196" cy="583" rx="104" ry="13"/>
  <ellipse fill="url(#burnish)" cx="438" cy="578" rx="88" ry="12"/>
  <ellipse fill="url(#warm)" cx="62" cy="9" rx="48" ry="34"/>
  <ellipse fill="url(#warm)" cx="470" cy="596" rx="56" ry="30"/>
  <ellipse fill="url(#burnish)" cx="300" cy="6" rx="42" ry="26"/>
  <ellipse fill="url(#burnish)" cx="8" cy="96" rx="30" ry="54"/>
  <path d="M82 3l17 1m247-1 23 1M5 145l1 19m590 89-1 21M193 596l29-1m270 2 13-1" stroke="#fff2d6" stroke-opacity=".1" fill="none"/>
  <path d="M58 11l9 .6m118-4 12 .8m214 3 10 .7M11 262l.7 12m3 156 .6 10m572-289-.6 11m-2 170-.7 12M96 590l13-.7m228 5 11-.6" stroke="#fdf7e6" stroke-opacity=".16" stroke-width="1.4" fill="none"/>
</svg>
